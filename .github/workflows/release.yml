name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

jobs:
  validate-version:
    name: Validate release version
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v7

    - name: Check tag against CMake project version
      shell: bash
      run: |
        set -euo pipefail

        cmake_version="$(sed -nE 's/^project\(SpectralFormantMorpher VERSION ([0-9]+\.[0-9]+\.[0-9]+)\)$/\1/p' CMakeLists.txt)"
        if [[ -z "$cmake_version" ]]; then
          echo "::error::Could not read the project version from CMakeLists.txt."
          exit 1
        fi

        expected_tag="v${cmake_version}"
        if [[ "$GITHUB_REF_NAME" != "$expected_tag" ]]; then
          echo "::error::Release tag '$GITHUB_REF_NAME' does not match expected tag '$expected_tag'."
          exit 1
        fi

  native:
    name: Build ${{ matrix.os }}
    needs: validate-version
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-15, windows-latest]

    steps:
    - uses: actions/checkout@v7

    - name: Install dependencies (Linux)
      if: runner.os == 'Linux'
      run: |
        sudo apt-get update
        sudo apt-get install -y libasound2-dev libjack-jackd2-dev \
            ladspa-sdk \
            libcurl4-openssl-dev \
            libfreetype-dev \
            libx11-dev libxcomposite-dev libxcursor-dev libxext-dev libxinerama-dev libxrandr-dev libxrender-dev \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev pkg-config \
            libglu1-mesa-dev mesa-common-dev

    - name: Check GTK3 (Linux)
      if: runner.os == 'Linux'
      run: |
        pkg-config --cflags --libs gtk+-3.0
        pkg-config --list-all | grep webkit

    - name: Configure CMake (macOS Universal 2)
      if: runner.os == 'macOS'
      run: cmake -B build -DCMAKE_BUILD_TYPE=Release -DSFM_COPY_PLUGIN_AFTER_BUILD=OFF "-DCMAKE_OSX_ARCHITECTURES=arm64;x86_64"

    - name: Configure CMake
      if: runner.os != 'macOS'
      run: cmake -B build -DCMAKE_BUILD_TYPE=Release -DSFM_COPY_PLUGIN_AFTER_BUILD=OFF

    - name: Build
      run: cmake --build build --config Release

    - name: Run tests
      run: ctest --test-dir build -C Release --output-on-failure

    - name: Package plugin artifacts
      shell: bash
      run: |
        set -euo pipefail

        artifact_dir="$PWD/packaged"
        mkdir -p "$artifact_dir"
        cd build/SpectralFormantMorpher_artefacts/Release

        case "${{ runner.os }}" in
          macOS)
            cmake -E tar czf "$artifact_dir/SpectralFormantMorpher-macos.tar.gz" \
              "VST3/Spectral Formant Morpher.vst3" \
              "AU/Spectral Formant Morpher.component" \
              "Standalone/Spectral Formant Morpher.app"
            ;;
          Windows)
            cmake -E tar cf "$artifact_dir/SpectralFormantMorpher-windows.zip" --format=zip \
              "VST3/Spectral Formant Morpher.vst3" \
              "Standalone/Spectral Formant Morpher.exe"
            ;;
          Linux)
            cmake -E tar czf "$artifact_dir/SpectralFormantMorpher-linux.tar.gz" \
              "VST3/Spectral Formant Morpher.vst3" \
              "Standalone/Spectral Formant Morpher"
            ;;
        esac

    - name: Upload plugin artifacts
      uses: actions/upload-artifact@v7
      with:
        name: SpectralFormantMorpher-${{ runner.os }}
        path: packaged/*
        if-no-files-found: error

  publish:
    name: Publish GitHub Release
    needs: native
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
    - name: Download native artifacts
      uses: actions/download-artifact@v8
      with:
        pattern: SpectralFormantMorpher-*
        path: release-assets
        merge-multiple: true

    - name: Publish release
      uses: softprops/action-gh-release@v3
      with:
        files: release-assets/*
        fail_on_unmatched_files: true
