name: Build

on: [push, pull_request]

jobs:
  build:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        # Pinned macos-14 to avoid macOS 15 SDK breaking changes (CGWindowListCreateImage obsoleted) with current JUCE version.
        os: [ubuntu-latest, macos-14, windows-latest]

    steps:
    - uses: actions/checkout@v7

    - name: Install dependencies (Linux)
      if: runner.os == 'Linux'
      # Updated for Ubuntu 24.04 (ubuntu-latest) and JUCE 8
      # Added libgtk-3-dev to satisfy juce_gui_extra requirement (fatal error: gtk/gtk.h)
      # Added pkg-config explicitely
      run: |
        sudo apt-get update
        sudo apt-get install -y libasound2-dev libjack-jackd2-dev \
            ladspa-sdk \
            libcurl4-openssl-dev  \
            libfreetype-dev \
            libx11-dev libxcomposite-dev libxcursor-dev libxext-dev libxinerama-dev libxrandr-dev libxrender-dev \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev pkg-config \
            libglu1-mesa-dev mesa-common-dev

    - name: Check GTK3 (Linux)
      if: runner.os == 'Linux'
      run: |
        pkg-config --cflags --libs gtk+-3.0
        pkg-config --list-all | grep webkit

    - name: Configure CMake
      run: cmake -B build -DCMAKE_BUILD_TYPE=Release -DSFM_COPY_PLUGIN_AFTER_BUILD=OFF

    - name: Build
      run: cmake --build build --config Release

    - name: Run Tests
      run: |
        cd build
        ctest -C Release --output-on-failure

    - name: Package plugin artifacts
      shell: bash
      run: |
        set -euo pipefail

        artifact_dir="$PWD/packaged"
        mkdir -p "$artifact_dir"
        cd build/SpectralFormantMorpher_artefacts/Release

        case "${{ runner.os }}" in
          macOS)
            cmake -E tar czf "$artifact_dir/SpectralFormantMorpher-macos.tar.gz" \
              "VST3/Spectral Formant Morpher.vst3" \
              "AU/Spectral Formant Morpher.component" \
              "Standalone/Spectral Formant Morpher.app"
            ;;
          Windows)
            cmake -E tar cf "$artifact_dir/SpectralFormantMorpher-windows.zip" --format=zip \
              "VST3/Spectral Formant Morpher.vst3" \
              "Standalone/Spectral Formant Morpher.exe"
            ;;
          Linux)
            cmake -E tar czf "$artifact_dir/SpectralFormantMorpher-linux.tar.gz" \
              "VST3/Spectral Formant Morpher.vst3" \
              "Standalone/Spectral Formant Morpher"
            ;;
        esac

    - name: Upload plugin artifacts
      uses: actions/upload-artifact@v7
      with:
        name: SpectralFormantMorpher-${{ runner.os }}
        path: packaged/*
        if-no-files-found: error
